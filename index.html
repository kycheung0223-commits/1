<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>大華帝國 - 宣政殿理政系統</title>
    <style>
        /* ==========================================================================
           1. 遊戲舞台與大背景設定 (Base Layout)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0705;
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff4d4;
            overflow: hidden;
        }

        /* 完美對應 Canva 畫布 1150 x 680 */
        .game-stage {
            width: 1150px;
            height: 680px;
            position: relative;
            background-image: url('images/bg_court_main.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        /* ==========================================================================
           2. 頂部 HUD 五大國運狀態欄 (Top HUD)
           ========================================================================== */
        .top-hud {
            position: absolute;
            top: 15px;
            left: 25px;
            width: 1100px;
            height: 95px; /* 微微拉高高度，容納上下兩層排版 */
            background-image: url('images/bg_hud_top.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 50;
        }

        /* 國運指標單個容器（改為上下垂直排列） */
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 0 10px;
        }

        /* 狀態欄上半部：小圖標與數值文字組 */
        .stat-text-group {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #ffeba7;
            margin-bottom: 5px; /* 與下方進度條的精密間距 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9);
        }

        /* 藉由偽元素導入 Canva 48x48 高清去背小圖標 */
        .stat-text-group::before {
            content: "";
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-right: 8px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
        }

        /* 五大指標圖標對接 */
        .stat-item.politics .stat-text-group::before    { background-image: url('images/icon_hud_politics.png'); }
        .stat-item.economy .stat-text-group::before     { background-image: url('images/icon_hud_economy.png'); }
        .stat-item.popularity .stat-text-group::before  { background-image: url('images/icon_hud_popularity.png'); }
        .stat-item.defense .stat-text-group::before     { background-image: url('images/icon_hud_defense.png'); }
        .stat-item.culture .stat-text-group::before     { background-image: url('images/icon_hud_culture.png'); }
        .stat-item.round .stat-text-group::before       { background-image: url('images/icon_hud_round.png'); }

        /* 🌟 核心：進度條外殼凹槽（載入 Canva 640x64 大圖強迫壓縮技術） */
        .stat-bar-container {
            width: 150px;   /* 網頁上呈現的精細寬度 */
            height: 16px;   /* 網頁上呈現的精細高度，徹底破解 Canva 40px 的下載限制 */
            background-image: url('images/bg_hud_stat_bar.png'); 
            background-size: 100% 100%; /* 大圖小用，自動高清縮放 */
            background-repeat: no-repeat;
            position: relative;
            padding: 3px 5px; /* 內襯微調，確保血條完美待在框內不溢出 */
            box-sizing: border-box;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.8);
        }

        /* 內部的紅黃綠國運漸層進度條本體 */
        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d9383a 0%, #f3af2b 50%, #3ca85c 100%);
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* 指標變動時滑順的動畫 */
        }

        /* 回合欄特殊處理（只有文字，不顯示進度條） */
        .stat-item.round .stat-bar-container {
            display: none;
        }
        .stat-item.round .stat-text-group {
            margin-bottom: 0;
            font-size: 18px;
            color: #ffffff;
        }

        /* ==========================================================================
           3. 天子聖駕區塊 (Emperor Section - Left Side)
           ========================================================================= */
        .emperor-section {
            position: absolute;
            top: 135px;
            left: 35px;
            width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 40;
        }

        /* 天子雙層背景融合頭像框 */
        .emperor-portrait {
            width: 130px;
            height: 130px;
            position: relative;
            margin-bottom: 15px;
            /* 上層疊加 Canva 金雕圓框，底層塞入寫實天子立繪 */
            background-image: 
                url('images/frame_emperor_portrait.png'), 
                url('images/avatar_emperor_default.jpg');
            background-position: center center, center center;
            background-size: 100% 100%, 92% 92%;
            background-repeat: no-repeat, no-repeat;
        }

        /* 天子下旨宣紙大框 */
        .emperor-requirement-box {
            width: 400px;
            height: 200px;
            background-image: url('images/bg_scroll_emperor.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 35px 40px;
            box-sizing: border-box;
            color: #3a2212; /* 適合宣紙的深墨寶色 */
            font-size: 16px;
            line-height: 1.6;
            font-weight: 600;
        }

        /* ==========================================================================
           4. 大臣卡牌選取區塊 (Advisors Section - Right Side)
           ========================================================================== */
        .advisors-container {
            position: absolute;
            top: 135px;
            right: 35px;
            width: 660px;
            display: flex;
            justify-content: space-between;
            z-index: 40;
        }

        .advisor-slot {
            width: 200px;
            height: 260px;
            position: relative;
            cursor: pointer;
        }

        /* 大臣卡牌主體 */
        .advisor-card {
            width: 100%;
            height: 100%;
            /* 疊加層：上層為卡牌紅木外殼，底層為翡翠底層 */
            background-image: 
                url('images/card_advisor_frame_normal.png'),
                url('images/card_jade_slot.png');
            background-size: 100% 100%, 100% 100%;
            background-repeat: no-repeat, no-repeat;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* 滑鼠懸停與選中狀態：無縫切換為 Canva 金皇光/發光翡翠邊框 */
        .advisor-slot:hover .advisor-card,
        .advisor-slot.selected .advisor-card {
            transform: translateY(-8px); /* 卡牌上浮 */
            background-image: 
                url('images/card_advisor_frame_hover.png'),
                url('images/card_jade_slot.png');
        }

        /* 卡牌內文（名字暫不使用底框底條，維持純文字動態渲染） */
        .advisor-info {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            text-shadow: 1px 2px 4px #000;
            font-size: 15px;
            line-height: 1.4;
        }

        /* ==========================================================================
           5. 奏摺彈窗面板 (Proposal Scroll Popup)
           ========================================================================== */
        .proposal-scroll-popup {
            position: absolute;
            bottom: 120px;
            right: 35px;
            width: 700px;
            height: 220px;
            background-image: url('images/bg_scroll_proposal.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 40px 60px;
            box-sizing: border-box;
            color: #2b1a0f;
            z-index: 45;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ==========================================================================
           6. 按鈕系統 - Canva 三態反饋極致流暢化 (Buttons Section)
           ========================================================================== */
        button {
            border: none;
            background-color: transparent;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            cursor: pointer;
            outline: none;
            transition: background-image 0.1s ease, transform 0.05s ease;
        }

        /* ✍️ 批准 / 天子御批按鈕 */
        .action-confirm-btn {
            width: 300px;
            height: 60px;
            background-image: url('images/btn_approve_normal.png');
            margin: 0 auto;
        }
        .action-confirm-btn:hover {
            background-image: url('images/btn_approve_hover.png'); /* 邊緣爆發金光 */
        }
        .action-confirm-btn:active {
            background-image: url('images/btn_approve_click.png'); /* 硃砂深紅，物理下沉 */
            transform: translateY(2px);
        }

        /* 📖 起居注按鈕 */
        .chronicle-anchor {
            position: absolute;
            bottom: 30px;
            left: 35px;
            width: 180px;
            height: 45px;
            background-image: url('images/btn_chronicle_normal.png');
            z-index: 50;
        }
        .chronicle-anchor:hover {
            background-image: url('images/btn_chronicle_hover.png');
        }
        .chronicle-anchor:active {
            background-image: url('images/btn_chronicle_click.png');
            transform: translateY(1px);
        }

        /* 🤝 百官退朝按鈕 */
        .next-turn-btn {
            position: absolute;
            bottom: 30px;
            right: 35px;
            width: 250px;
            height: 60px;
            background-image: url('images/btn_next_turn_normal.png');
            z-index: 50;
        }
        .next-turn-btn:hover {
            background-image: url('images/btn_next_turn_hover.png');
        }
        .next-turn-btn:active {
            background-image: url('images/btn_next_turn_click.png');
            transform: translateY(2px);
        }

        /* ==========================================================================
           7. 裝飾性原件 (Decorative Elements)
           ========================================================================== */
        /* 天子御批硃砂紅印章 */
        .seal-stamp {
            position: absolute;
            bottom: 50px;
            right: 80px;
            width: 120px;
            height: 120px;
            background-image: url('images/seal_emperor_approval.png');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.9;
            transform: rotate(-10deg); /* 帶有一點點天然的不規則傾斜 */
            pointer-events: none; /* 防止擋住按鈕點擊 */
            z-index: 46;
            display: none; /* 由 JS 在點擊批准後動態觸發顯示 */
        }
    </style>
</head>
<body>

    <div class="game-stage">

        <div class="top-hud">
            <div class="stat-item politics">
                <div class="stat-text-group">
                    <span>政治: <span id="val-politics">60</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-politics" style="width: 60%;"></div>
                </div>
            </div>
            <div class="stat-item economy">
                <div class="stat-text-group">
                    <span>經濟: <span id="val-economy">50</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-economy" style="width: 50%;"></div>
                </div>
            </div>
            <div class="stat-item popularity">
                <div class="stat-text-group">
                    <span>民心: <span id="val-popularity">65</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-popularity" style="width: 65%;"></div>
                </div>
            </div>
            <div class="stat-item defense">
                <div class="stat-text-group">
                    <span>國防: <span id="val-defense">45</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-defense" style="width: 45%;"></div>
                </div>
            </div>
            <div class="stat-item culture">
                <div class="stat-text-group">
                    <span>文化: <span id="val-culture">55</span></span>
                </div>
                <div class="stat-bar-container">
                    <div class="stat-bar-fill" id="bar-culture" style="width: 55%;"></div>
                </div>
            </div>
            <div class="stat-item round">
                <div class="stat-text-group">
                    <span id="game-round">大華元年</span>
                </div>
            </div>
        </div>

        <div class="emperor-section">
            <div class="emperor-portrait"></div>
            <div class="emperor-requirement-box">
                <div style="font-weight: bold; margin-bottom: 5px;">【天子聖旨】</div>
                <div id="emperor-text">邊關戰事吃緊，急需充實軍備與糧草。各愛卿有何良策？</div>
            </div>
        </div>

        <div class="advisors-container">
            <div class="advisor-slot" onclick="selectAdvisor(this, '飛')">
                <div class="advisor-card">
                    <div class="advisor-info">
                        <strong>岳飛</strong><br>大將軍
                    </div>
                </div>
            </div>
            <div class="advisor-slot selected" onclick="selectAdvisor(this, '居正')">
                <div class="advisor-card">
                    <div class="advisor-info">
                        <strong>張居正</strong><br>內閣首輔
                    </div>
                </div>
            </div>
            <div class="advisor-slot" onclick="selectAdvisor(this, '徵')">
                <div class="advisor-card">
                    <div class="advisor-info">
                        <strong>魏徵</strong><br>諫議大夫
                    </div>
                </div>
            </div>
        </div>

        <div class="proposal-scroll-popup">
            <div id="proposal-text" style="line-height: 1.6; font-weight: 600;">
                <span style="font-size: 18px; font-weight: bold;">【奏摺】</span><br>
                <span id="proposal-content">臣張居正啟奏：推行「一條鞭法」，整頓田賦，可使大華國庫稅收翻倍，充實邊防軍費。</span>
            </div>
            <button class="action-confirm-btn" onclick="approveProposal()"></button>
            <div class="seal-stamp" id="approval-seal"></div>
        </div>

        <button class="chronicle-anchor" title="開啟起居注"></button>
        <button class="next-turn-btn" title="進入下一回合"></button>

    </div>

    <script>
        // 大臣奏摺資料庫，方便動態切換
        const proposals = {
            '飛': '臣岳飛啟奏：郾城大捷，金兵士氣已潰！懇請陛下賜予軍餉十萬兩，臣定當直搗黃龍，迎回聖駕，光復大華河山！',
            '居正': '臣張居正啟奏：推行「一條鞭法」，整頓田賦，計畝徵銀。此法可使大華國庫稅收翻倍，充實邊防軍費。',
            '徵': '臣魏徵啟奏：居安思危，戒奢以儉。近來宮廷營造奢華，民心偶有不穩，懇請陛下罷止不急之務，廣開言路。'
        };

        // 大臣翻牌（點擊卡牌切換發光邊框，並動態改寫奏摺文字）
        function selectAdvisor(element, name) {
            document.querySelectorAll('.advisor-slot').forEach(slot => {
                slot.classList.remove('selected');
            });
            element.classList.add('selected');
            
            // 更新奏摺文字
            document.getElementById('proposal-content').innerText = proposals[name];
            // 隱藏御批印章
            document.getElementById('approval-seal').style.display = 'none';
        }

        // 點擊御批按鈕後，硃砂印章蓋上的視覺互動（陛下，此處可自由追加扣除或增加數值的程式碼邏輯）
        function approveProposal() {
            const seal = document.getElementById('approval-seal');
            seal.style.display = 'block';
            
            // 範例：點擊批准後，動態改變某一項國運數值與進度條長度
            // document.getElementById('val-politics').innerText = "75";
            // document.getElementById('bar-politics').style.width = "75%";
        }
    </script>
</body>
</html>
